name: Update models.json daily

on:
  schedule:
    # UTC timezone, daily at 06:00
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Dispatch the deploy and Docker workflows when the catalog changes
  actions: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the catalog
        run: pnpm fetch-models

      - name: Commit and push the catalog if it changed
        id: commit
        run: |
          if git diff --quiet -- public/models.json; then
            echo "Catalog unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models.json
          git commit -m "chore(models): refresh public/models.json (scheduled)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows: dispatch them
      - name: Redeploy with the new catalog
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --ref "${{ github.ref_name }}"
          gh workflow run docker-build.yml --ref "${{ github.ref_name }}"
